  POLICY_QUERY: [制度, 标准, 规定, 必须, 应当, 管理要求]
  METHOD_GUIDANCE: [如何, 怎么, 方法, 流程, 步骤, 做法]
  CASE_QUERY: [案例, 经验, 复盘, 项目总结]
  COMPARISON: [对比, 比较, 区别, 差异]

