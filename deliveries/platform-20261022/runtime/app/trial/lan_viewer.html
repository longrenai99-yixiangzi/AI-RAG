<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计管理知识库 · 查看与提问</title>
<style>body{font:16px/1.7 system-ui;margin:24px auto;max-width:1000px;padding:0 16px;color:#18334b;background:#f6f9fc}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbcddd;border-radius:6px}button{padding:10px 18px;margin:10px 8px 10px 0;cursor:pointer}section,details{background:white;border:1px solid #dce5ed;border-radius:8px;padding:16px;margin:14px 0}pre{white-space:pre-wrap;font:inherit}img{max-width:100%}.note{color:#54697a}a{color:#075aaa}</style>
<h1>设计管理知识库</h1><p class="note">同事入口：查看资料、提问与核对引用。资料仍有适用范围，请结合原文判断。原文不足时不补编答案。</p><p id="status">正在连接本机知识库……</p>
<section><h2>业务提问</h2><p class="note">请写明项目、阶段或资料名称。已批准资料内可能调用DeepSeek公网模型，共用原批准额度；其余资料本地检索。不要在问题中输入新的敏感信息。</p><textarea id="question" rows="3" maxlength="2000" placeholder="请输入业务问题"></textarea><button id="ask">提交问题</button><div id="answer"></div></section>
<section><h2>查找资料</h2><input id="filter" placeholder="按文件名称查找"><button id="find">查找</button><button id="prev">上一页</button><button id="next">下一页</button><p id="count"></p><div id="library"></div></section>
<script>
const $=id=>document.getElementById(id);let offset=0,total=0;
async function api(path,body){let r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Viewer-Request':'1'},body:JSON.stringify(body)}:{});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(typeof d.detail==='string'?d.detail:'请求暂未完成，请稍后查看，不会自动重试。')}return r.json()}
function text(tag,value,parent){let e=document.createElement(tag);e.textContent=value||'';parent.append(e);return e}
function card(c,parent){let d=document.createElement('details');parent.append(d);text('summary',(c.citation_id?'['+c.citation_id+'] ':'')+(c.file_name||c.heading_path||c.evidence_id||'原文')+' '+(c.display_location||''),d);text('pre',c.excerpt||c.text,d);let page=c.location?.page;if(page&&c.source_id){let a=document.createElement('a');a.textContent='查看PDF原页 '+page;a.href='/api/page/'+encodeURIComponent(c.source_id)+'/'+Number(page);a.target='_blank';a.rel='noopener';d.append(a)}}
$('ask').onclick=async()=>{let q=$('question').value.trim();if(!q)return;$('ask').disabled=true;$('answer').textContent='正在检索，请勿重复提交……';try{let row=await api('/api/query',{question:q}),r=row.result||row;$('answer').textContent='';text('p',r.status_label||r.answer_status,$('answer'));text('pre',r.answer,$('answer'));if(r.notice)text('p',r.notice,$('answer'));(r.citations||[]).forEach(c=>card(c,$('answer')))}catch(e){$('answer').textContent=e.message}finally{$('ask').disabled=false}};
async function load(){try{let r=await api('/api/library?q='+encodeURIComponent($('filter').value)+'&offset='+offset);total=r.total;$('count').textContent='共 '+total+' 份来源，当前 '+(offset+1)+'—'+Math.min(offset+30,total);$('library').textContent='';for(let s of r.items){let d=document.createElement('details');$('library').append(d);text('summary',s.file_name||s.name,d);let b=text('button','查看已入库正文',d);b.onclick=async()=>{b.disabled=true;try{let e=await api('/api/evidence/'+encodeURIComponent(s.source_id));(e.items||[]).forEach(c=>card({...c,file_name:s.file_name},d))}catch(e){text('p',e.message,d)}}}}catch(e){$('library').textContent=e.message}}
$('find').onclick=()=>{offset=0;load()};$('prev').onclick=()=>{offset=Math.max(0,offset-30);load()};$('next').onclick=()=>{if(offset+30<total){offset+=30;load()}};
api('/api/health').then(s=>{$('status').textContent=s.runtime?.ready?'当前可检索 '+s.runtime.sources+' 份来源。模型是否可用按原批准策略和到期时间执行。':'资料索引尚未就绪，请稍候。'}).catch(e=>$('status').textContent=e.message);load();
</script></html>
