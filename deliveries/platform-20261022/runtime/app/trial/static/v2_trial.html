<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI设计管理知识库 · V2受控试用</title>
<style>
:root{--ink:#113c52;--brand:#087b71;--soft:#edf6f6;--line:#d6e4e5;--warn:#a85d00}*{box-sizing:border-box}body{margin:0;background:#f2f7f8;color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 8px 26px #113c5209}h1{margin:0;font-size:26px}h2{font-size:18px;margin:0 0 10px}.muted{color:#64808c}.notice{border-left:4px solid var(--brand);padding:8px 12px;background:#f7fbfb}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.modes label,.feedback button,.review button{border:1px solid var(--line);padding:6px 10px;border-radius:8px;background:#fff;cursor:pointer}.primary{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font-weight:700}textarea,select{border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}textarea{width:100%;min-height:92px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.panel h3{margin:0 0 6px;font-size:16px}.status{font-weight:700;color:var(--brand)}.answer{white-space:pre-wrap;min-height:66px}.citation{border-top:1px dashed var(--line);padding:8px 0;font-size:12px}.citation b{display:block}details{margin-top:10px}pre{background:#102c3b;color:#d9f1ef;padding:12px;border-radius:8px;overflow:auto;max-height:380px;font-size:11px}.feedback{display:flex;gap:8px;flex-wrap:wrap}.feedback button.active{border-color:var(--brand);background:#e4f6f2}.candidate{border-top:1px solid var(--line);padding:10px 0}.candidate b{display:block}.warning{color:var(--warn)}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<h1>AI设计管理知识库 · V2受控试用</h1><p class="muted">仅8010本机试用。A/B差异可见；V2不发布知识、不修改正式索引。</p>
<section class="card"><div class="notice">V2 Verified：020C层级检索 → 020E证据核验 → 020F确定性回答 → 020G候选发现。B模式优先使用本地BGE-M3 FP32；如本地模型异常，将明确记录Sparse回退。</div>
<textarea id="question" placeholder="请输入设计管理问题"></textarea><div class="controls"><select id="user"><option value="reviewer-001">业务负责人 1</option><option value="reviewer-002">业务负责人 2</option><option value="reviewer-003">业务负责人 3</option></select><span class="modes"><label><input id="legacy" type="checkbox" checked> A · CURRENT / LEGACY</label><label><input id="v2" type="checkbox" checked> B · V2 VERIFIED</label></span><button class="primary" id="ask">并排查证</button></div></section>
<section class="grid" id="results" hidden><article class="card panel"><h3>A · CURRENT / LEGACY</h3><div class="status" id="a-status">等待提问</div><div class="answer" id="a-answer"></div><div id="a-citations"></div></article><article class="card panel"><h3>B · V2 VERIFIED</h3><div class="status" id="b-status">等待提问</div><div class="answer" id="b-answer"></div><div id="b-citations"></div><details><summary>管理员诊断</summary><pre id="b-debug"></pre></details></article></section>
<section class="card" id="feedback-card" hidden><h2>本题反馈</h2><div class="feedback" id="feedback"><button>回答正确</button><button>回答不完整</button><button>引用不对</button><button>资料缺失</button><button>答案冲突</button><button>其他</button></div><textarea id="comment" placeholder="补充意见（可选）"></textarea><button class="primary" id="send-feedback">提交反馈</button><span class="muted" id="feedback-message"></span></section>
<section class="card"><div class="controls"><h2 style="margin-right:auto">管理员 · Growth Candidate</h2><button id="refresh-growth">刷新候选</button></div><div id="growth" class="muted">点击刷新查看待审核候选。</div></section>
</main><script>
const $=id=>document.getElementById(id);let lastV2=null,choice='';
function esc(v){return String(v??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function cite(rows){return (rows||[]).map(x=>`<div class="citation"><b>${esc(x.file_name||'未命名文件')}</b>${esc(x.display_location||x.location||'位置已记录')}${x.excerpt?`<details><summary>查看Evidence</summary><div class="answer">${esc(x.excerpt)}</div></details>`:''}</div>`).join('')||'<p class="muted">无可展示引用</p>'}
function legacyCard(value){$('a-status').textContent=value.answer_state||value.final_status||'完成';$('a-answer').textContent=value.answer||value.user_message||'';$('a-citations').innerHTML=cite(value.evidence||[])}
function v2Card(value){lastV2=value;$('b-status').textContent=value.status_label+' · '+value.answer_status;$('b-answer').textContent=value.answer;$('b-citations').innerHTML=cite(value.citations);$('b-debug').textContent=JSON.stringify(value.debug,null,2);$('feedback-card').hidden=false}
async function ask(){const q=$('question').value.trim();if(!q)return $('question').focus();$('ask').disabled=true;$('results').hidden=false;const user=$('user').value;const jobs=[];if($('legacy').checked)jobs.push(fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,trial_user:user})}).then(r=>r.json()).then(legacyCard).catch(e=>legacyCard({answer_state:'请求失败',user_message:e.message})));if($('v2').checked)jobs.push(fetch('/api/v2/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,trial_user:user})}).then(r=>r.json()).then(v2Card).catch(e=>v2Card({status_label:'请求失败',answer_status:'ERROR',answer:e.message,citations:[],debug:{}})));await Promise.all(jobs);$('ask').disabled=false}
$('ask').onclick=ask;document.querySelectorAll('#feedback button').forEach(b=>b.onclick=()=>{choice=b.textContent;document.querySelectorAll('#feedback button').forEach(x=>x.classList.toggle('active',x===b))});$('send-feedback').onclick=async()=>{if(!lastV2||!choice)return $('feedback-message').textContent='请选择反馈类型。';const r=await fetch('/api/v2/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query_id:lastV2.query_id,trial_user:$('user').value,feedback_type:choice,comment:$('comment').value})});$('feedback-message').textContent=r.ok?'反馈已记录，仅生成待审核事件。':'反馈保存失败。'};
async function growth(){const r=await fetch('/api/v2/growth-candidates');const v=await r.json();$('growth').innerHTML=(v.candidates||[]).map(x=>`<div class="candidate"><b>${esc(x.question)}</b><span class="muted">${esc(x.failure_type)} · ${esc(x.growth_type)} · ${esc(x.priority)}</span><p>${esc(x.reason)}<br>${esc(x.recommended_action)}</p><div class="review"><button onclick="review('${x.candidate_id}','APPROVE')">批准</button><button onclick="review('${x.candidate_id}','REJECT')">拒绝</button><button onclick="review('${x.candidate_id}','DEFER')">暂缓</button><button onclick="review('${x.candidate_id}','MERGE')">合并</button></div></div>`).join('')||'暂无待审核候选。'}
async function review(id,decision){const comment=prompt('审核意见（可选）','')??'';await fetch('/api/v2/growth-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidate_id:id,trial_user:$('user').value,decision,comment})});growth()}window.review=review;$('refresh-growth').onclick=growth;
</script></body></html>
